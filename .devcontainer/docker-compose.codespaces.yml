# Ajuste para GitHub Codespaces: se combina con docker-compose.yml mediante COMPOSE_FILE
# (definido en devcontainer.json), así que en el codespace "docker compose up -d" lo aplica solo.
#
# n8n deja de publicar el puerto 5678 y lo publica un nginx delante (nginx-n8n.conf), que
# corrige los encabezados del reenvío de puertos para que el editor no pierda la conexión
# en vivo ("Connection lost"). En una instalación local con Docker no se usa.
services:
  n8n:
    ports: !reset []

  n8n-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ./.devcontainer/nginx-n8n.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
