# Proxy delante de n8n, solo en Codespaces (ver docker-compose.codespaces.yml).
#
# n8n valida que el Origin del navegador coincida con el host que recibe (Forwarded,
# X-Forwarded-Host o Host, en ese orden). El reenvío de puertos de Codespaces agrega
# X-Forwarded-Host con el dominio *.app.github.dev, pero el navegador puede estar en
# http://localhost:5678 (VS Code de escritorio, enlaces a localhost): n8n rechaza la conexión
# en vivo del editor y aparece "Connection lost". Aquí el host esperado se toma del Origin.

map $http_origin $origen_host {
    "~^https?://(?<h>[^/]+)$" $h;
    default                   $http_host;
}
map $http_origin $origen_proto {
    "~^(?<p>https?)://"       $p;
    default                   $scheme;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5678;
    client_max_body_size 64m;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $origen_host;
        proxy_set_header X-Forwarded-Proto $origen_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forwarded tiene prioridad en n8n: se elimina para que use X-Forwarded-Host
        proxy_set_header Forwarded "";
        # Conexión en vivo del editor (WebSocket / SSE) y ejecuciones largas
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
